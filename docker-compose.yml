version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notesgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-notesgram}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  mock-llm:
    image: node:18-alpine
    command: ["node", "-e", "require(\"http\").createServer((req,res)=>res.end(JSON.stringify({ok:true}))).listen(8080)"]
    ports:
      - "${MOCK_LLM_PORT:-8080}:8080"
    restart: "no"

volumes:
  db-data:
