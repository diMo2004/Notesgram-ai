# =============================================================================
# Alembic Configuration
# =============================================================================
#
# This file is the ENTRY POINT for the `alembic` CLI.  When you run:
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "add users table"
#   alembic downgrade -1
#
# Alembic reads THIS file first to find:
#   1. Where the migration scripts live (script_location)
#   2. How to connect to the database (sqlalchemy.url)
#   3. Logging configuration
#
# Think of it like pyproject.toml but for migrations.
# =============================================================================

[alembic]

# Where the migration environment lives (env.py, script.py.mako, versions/)
# This is RELATIVE to the directory where you run `alembic` from.
# Since we run from backend/, this points to backend/app/db/alembic/
script_location = app/db/alembic

# Template for new migration filenames.
# %(rev)s  = revision hash (short)
# %(slug)s = slugified version of the -m message
file_template = %%(rev)s_%%(slug)s

# Where to store the "current revision" stamp.
# Default is a file, but in practice Alembic stores it in a
# `alembic_version` table in the database itself.

# Timezone for timestamps in migration files
# timezone =

# The database URL.  We set a dummy here because env.py overrides it
# at runtime by reading the DATABASE_URL environment variable.
# This way, secrets never live in this config file.
sqlalchemy.url = driver://user:pass@localhost/dbname

# ── Logging ──────────────────────────────────────────────────────────
# Standard Python logging config.  Alembic logs migration operations
# through these loggers.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
